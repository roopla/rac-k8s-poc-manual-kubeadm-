# 09-asm-pv.yaml
# ASM shared block devices as local PVs, available on worker1 and worker2.
# Differences from the Oracle doc:
#   - path uses /dev/disk/by-id (same serial on both workers because it is the same VDI),
#     not /dev/sdd / /dev/sde which can change order between boots
#   - capacity 50Gi to match the real disk size (doc shows 100Gi on 50 GB disks)
#
# Fill in the two by-id names first. On worker1 AND worker2 run:
#   ls -l /dev/disk/by-id/ | grep -E 'sdd|sde'
# Use the ata-VBOX_HARDDISK_VB... entries; they must be identical on both workers.
# Apply after: kubectl create namespace rac
apiVersion: v1
kind: PersistentVolume
metadata:
  name: block-asm-disk1-pv-vol1
  labels:
    asm_vol: block-asm-pv-vol1
spec:
  volumeMode: Block
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /dev/disk/by-id/ata-VBOX_HARDDISK_VB08838e9a-859011b0   # asm1, same ID on worker1 and worker2
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker1, worker2]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: block-asm-disk1-pv-vol2
  labels:
    asm_vol: block-asm-pv-vol2
spec:
  volumeMode: Block
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /dev/disk/by-id/ata-VBOX_HARDDISK_VB7deb55e4-31c996aa   # asm2
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker1, worker2]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: block-asm-pvc-vol1
  namespace: rac
spec:
  accessModes: [ReadWriteMany]
  volumeMode: Block
  storageClassName: ""
  resources:
    requests:
      storage: 50Gi
  selector:
    matchLabels:
      asm_vol: block-asm-pv-vol1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: block-asm-pvc-vol2
  namespace: rac
spec:
  accessModes: [ReadWriteMany]
  volumeMode: Block
  storageClassName: ""
  resources:
    requests:
      storage: 50Gi
  selector:
    matchLabels:
      asm_vol: block-asm-pv-vol2
